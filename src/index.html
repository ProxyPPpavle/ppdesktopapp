<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>PP Ghost Agent</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html,
    body {
      background: rgba(0, 0, 0, 0) !important;
      /* Forces hit-test on transparent area */
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      width: 100vw;
      pointer-events: auto;
      /* Ensure events can pass through if children allow */
    }

    .viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      pointer-events: none;
    }

    /* Input Container - MAXIMUM STEALTH */
    #minimal-input-container {
      display: none;
      background: rgba(0, 0, 0, 0);
      border-radius: 2px;
      width: 350px;
      /* Povećana širina ekrana za lakši pogodak */
      padding: 1px;
      pointer-events: auto;
      margin-bottom: 0px;
      margin-right: 0px;
    }

    /* Hub View - Premium & Modern */
    #hub-view {
      display: none;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-radius: 12px;
      width: 260px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      margin: 0;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      max-height: 100vh;
      overflow-y: auto;
    }

    #close-hub-x {
      position: absolute;
      top: 10px;
      right: 12px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      transition: color 0.2s;
      z-index: 100;
    }

    #close-hub-x:hover {
      color: #f87171;
    }

    #ai-prompt {
      width: 100%;
      height: 80px;
      /* Povećana visina area-e */
      background: transparent !important;
      border: none !important;
      color: rgba(255, 255, 255, 0) !important;
      font-size: 14px;
      resize: none;
      outline: none !important;
      box-sizing: border-box;
      font-family: inherit;
      padding: 20px;
      /* Mnogo veći unutrašnji klikabilni prostor */
      overflow: hidden;
      caret-color: transparent !important;
      cursor: text !important;
      /* Vraćen kursor za kucanje */
      transition: none;
    }

    #ai-prompt::placeholder {
      color: rgba(255, 255, 255, 0);
    }

    #ai-prompt:focus {
      color: rgba(255, 255, 255, 0);
    }

    /* Success Blink Animation */
    @keyframes green-blink {
      0% {
        box-shadow: 0 0 0px rgba(16, 185, 129, 0);
      }

      50% {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
        border-color: #10b981;
      }

      100% {
        box-shadow: 0 0 0px rgba(16, 185, 129, 0);
      }
    }

    .success-mode {
      animation: green-blink 1s ease-in-out 2;
    }

    /* Result Checkbox - Now a small 'C' button */
    #stealth-result {
      display: none;
      background: rgba(255, 255, 255, 0.01);
      border-radius: 1px;
      width: 16px;
      height: 16px;
      color: rgba(255, 255, 255, 0.03);
      font-size: 9px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto !important;
      margin-bottom: 0px;
      margin-right: 0px;
      transition: background 0.2s, color 0.2s;
      border: none;
      z-index: 9999;
      position: relative;
    }

    #stealth-result:hover {
      background: rgba(14, 165, 233, 0.05);
      color: rgba(255, 255, 255, 0.2);
    }

    #stealth-result.fail {
      background: rgba(255, 255, 255, 0.01);
      color: rgba(255, 255, 255, 0.02);
    }

    /* Loading state */
    .typing-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      margin: 0 2px;
      animation: dot-blink 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dot-blink {

      0%,
      80%,
      100% {
        opacity: 0;
      }

      40% {
        opacity: 1;
      }
    }

    .hub-header {
      margin-bottom: 14px;
    }

    .hub-header i {
      font-size: 24px;
      color: #38bdf8;
      margin-bottom: 8px;
      display: block;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
    }

    #hub-view h3 {
      color: #f8fafc;
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .hub-subtitle {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 2px;
      display: block;
    }

    .hub-input-group {
      position: relative;
      margin-bottom: 12px;
      text-align: left;
    }

    .hub-input-group label {
      display: block;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hub-input {
      width: 100%;
      padding: 10px;
      background: rgba(2, 6, 23, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.5);
      color: #f8fafc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      font-size: 12px;
      transition: all 0.2s;
    }

    .hub-input:focus {
      border-color: #38bdf8;
      background: rgba(2, 6, 23, 0.8);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }

    .btn {
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      border: none;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      box-sizing: border-box;
    }

    .btn-main {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #0c4a6e;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(51, 65, 85, 1);
      color: #94a3b8;
      margin-top: 8px;
    }

    .btn-logout {
      background: transparent;
      color: #f87171;
      margin-top: 6px;
      font-size: 10px;
      opacity: 0.7;
    }

    .stats-card {
      background: rgba(2, 6, 23, 0.4);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(51, 65, 85, 0.3);
    }

    #hub-credits {
      color: #f8fafc;
      font-size: 20px;
      font-weight: 800;
      margin: 2px 0;
    }

    .stats-label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .ghost-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      padding: 3px 6px;
      border-radius: 99px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    #hub-status {
      font-size: 10px;
      margin-top: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .status-active .status-dot {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .status-error .status-dot {
      background: #ef4444;
    }

    .status-pending .status-dot {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="viewport">
    <!-- HUB -->
    <div id="hub-view">
      <div id="close-hub-x">
        <i class="fas fa-times"></i>
      </div>
      <div class="hub-header">
        <i class="fas fa-ghost"></i>
        <h3>PP Agent Manager</h3>
        <span class="hub-subtitle">Silent AI Assistance</span>
      </div>

      <div id="setup-section">
        <div class="hub-input-group">
          <label for="clientIdInput">Authentication</label>
          <input type="text" id="clientIdInput" class="hub-input" placeholder="Enter Client ID..." spellcheck="false">
        </div>
        <button id="activateBtn" class="btn btn-main">
          <i class="fas fa-bolt"></i> Activate Agent
        </button>
      </div>

      <div id="active-section" style="display: none;">
        <div class="ghost-badge">
          <i class="fas fa-shield-halved"></i> GHOST MODE ACTIVE
        </div>

        <div class="stats-card">
          <div class="stats-label">Available API Credits</div>
          <div id="hub-credits">...</div>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 10px;">
          <button id="closeHubBtn" class="btn btn-main" style="margin-top: 0; flex: 1;">
            <i class="fas fa-circle-xmark"></i> Close
          </button>
          <button id="logoutBtn" class="btn btn-outline" style="margin-top: 0; flex: 1; padding: 10px 4px;">
            <i class="fas fa-right-from-bracket"></i> Logout
          </button>
        </div>
      </div>

      <div id="hub-status">
        <div class="status-dot"></div>
        <span id="status-text">System Ready</span>
      </div>
    </div>

    <!-- Result -->
    <div id="stealth-result">
      <span id="res-label">C</span>
    </div>

    <!-- Input -->
    <div id="minimal-input-container">
      <textarea id="ai-prompt" placeholder="Upisi pitanje..." spellcheck="false"></textarea>
    </div>
  </div>

  <script src="main.js"></script>
</body>

</html>
